services:
  postgres:
    image: postgres:16-alpine
    container_name: btc_trading_engine_postgres
    environment:
      POSTGRES_DB: btc_trading_engine
      POSTGRES_USER: btc_engine
      # Read from .env (see .env.example); compose refuses to start if it is not set.
      POSTGRES_PASSWORD: ${BTC_ENGINE_DB_PASSWORD:?set BTC_ENGINE_DB_PASSWORD in .env}
    ports:
      # Loopback only: the database is not exposed to the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btc_engine -d btc_trading_engine"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - btc_trading_engine_network

  # The engine itself (issue #105): `docker compose up -d` builds btctradingengine/Dockerfile and starts it once
  # postgres is healthy. Secrets come from .env (see .env.example) through the variables below; blank ones fall
  # back to application.properties, exactly as when running the jar.
  app:
    build:
      context: ./btctradingengine
    image: btc-trading-engine:local
    container_name: btc_trading_engine_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Same database as the postgres service, reached by its service name on the compose network.
      DB_URL: jdbc:postgresql://postgres:5432/btc_trading_engine
      BTC_ENGINE_DB_PASSWORD: ${BTC_ENGINE_DB_PASSWORD:?set BTC_ENGINE_DB_PASSWORD in .env}
      BTC_ENGINE_BINANCE_API_KEY: ${BTC_ENGINE_BINANCE_API_KEY:-}
      BTC_ENGINE_BINANCE_API_SECRET: ${BTC_ENGINE_BINANCE_API_SECRET:-}
      BTC_ENGINE_TRADING_OCO_ENABLED: ${BTC_ENGINE_TRADING_OCO_ENABLED:-}
      BTC_ENGINE_TRADING_SIZING_STRATEGY: ${BTC_ENGINE_TRADING_SIZING_STRATEGY:-}
      BTC_ENGINE_DISCORD_WEBHOOK_URL: ${BTC_ENGINE_DISCORD_WEBHOOK_URL:-}
      # Dashboard login; blank = nobody can log in (fail closed).
      DASHBOARD_AUTH_PASSWORD: ${DASHBOARD_AUTH_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      ENGINE_PIPELINE_ENABLED: ${ENGINE_PIPELINE_ENABLED:-true}
    ports:
      # Loopback only, like the dashboard outside Docker; the image listens on 0.0.0.0 inside the container.
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    networks:
      - btc_trading_engine_network

  # Observability (issue #104), off by default: `docker compose --profile observability up -d`.
  # Prometheus scrapes /actuator/prometheus with the dashboard login from ops/prometheus/secrets/dashboard_password
  # (see ops/prometheus/prometheus.yml) and evaluates ops/prometheus/alerts.yml.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: btc_trading_engine_prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./ops/prometheus/secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - btc_trading_engine_network

  # Grafana with the Prometheus datasource and the "BTC Trading Engine" dashboard provisioned from ops/grafana.
  grafana:
    image: grafana/grafana-oss:12.1.1
    container_name: btc_trading_engine_grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Set GRAFANA_ADMIN_PASSWORD in .env; the fallback is only acceptable because the port is loopback-only.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - btc_trading_engine_network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  btc_trading_engine_network:
    driver: bridge
