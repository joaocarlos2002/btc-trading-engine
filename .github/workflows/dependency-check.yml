name: Dependency-Check

# OWASP Dependency-Check over the whole reactor (issue #110). Weekly and on demand, report only: it never fails.
# Set the NVD_API_KEY repository secret (https://nvd.nist.gov/developers/request-an-api-key); without it the
# first NVD download takes very long and may be rate limited.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: btctradingengine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: btctradingengine/**/pom.xml

      - name: NVD data cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      - name: Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B org.owasp:dependency-check-maven:aggregate -Dcheckstyle.skip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check
          path: btctradingengine/target/dependency-check-report.*
          if-no-files-found: ignore

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: btctradingengine/target/dependency-check-report.sarif
          category: dependency-check
