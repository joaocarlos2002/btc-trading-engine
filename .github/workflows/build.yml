name: Build

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: btctradingengine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: btctradingengine/**/pom.xml

      - name: Build
        # Reactor root: builds every module in dependency order; the executable jar is engine-app/target/engine-app-*.jar
        run: mvn -B clean package -DskipTests