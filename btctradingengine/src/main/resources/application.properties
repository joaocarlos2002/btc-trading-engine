market.symbol=BTCUSDT
market.interval.seconds=60
market.binance.interval=1m
# SMA(750) needs 750+ candles of warmup; keep some margin above the largest period below.
market.history.candles=1000

# Periods scaled x15 vs the original 15m config so each indicator still covers the same
# real-time window (e.g. RSI: 14*15m=3.5h -> 210*1m=3.5h), just recomputed every minute
# instead of every 15 minutes. Validated via backtest on 90 days of real BTCUSDT 1m data.
indicator.sma.period=750
indicator.ema.period=390
indicator.rsi.period=210
indicator.atr.period=210
indicator.macd.fast.period=180
indicator.macd.slow.period=390
indicator.macd.signal.period=135

# New indicators (issue #5), periods already scaled x15 for 1m candles like the block above:
# ADX 14*15m -> 210*1m, Bollinger/Donchian 20*15m -> 300*1m, MFI 14*15m -> 210*1m.
# These are the classic periods rescaled, NOT calibrated for this timeframe - run the
# /backtest endpoint (which accepts every one of them as a query param) before trusting them.
indicator.adx.period=210
indicator.bollinger.period=300
indicator.bollinger.stddev=2.0
indicator.mfi.period=210
indicator.donchian.period=300
# daily = reset the VWAP accumulator on every UTC day change (live default);
# rolling = sliding window of indicator.vwap.rolling.periods candles (what backtests want,
# since an arbitrary date range would otherwise start with a half-accumulated session).
indicator.vwap.anchor=daily
indicator.vwap.rolling.periods=300

feature.volatility.short.periods=75
feature.volatility.long.periods=300
feature.volume.average.periods=300

prediction.rsi.oversold=30
prediction.rsi.neutral.low=40
prediction.rsi.neutral.high=60
prediction.rsi.overbought=70
prediction.sma.distance.extreme=3
prediction.sma.distance.moderate=1
# Calibrated for the rescaled 1m ATR(210) % distribution on BTCUSDT (p25 ~0.023%,
# p75 ~0.060%, p95 ~0.119% over a 90-day sample). Re-check these if indicator.atr.period
# or the candle interval changes again - they are NOT portable across timeframes (this
# project already got bitten once by reusing daily-candle ATR% thresholds at 15m).
prediction.atr.volatility.low=0.023
prediction.atr.volatility.normal=0.060
prediction.atr.volatility.high=0.119
prediction.macd.histogram.strong.atr.ratio=0.20
prediction.volatility.ratio.high=1.5

# Regime/flow thresholds for the new indicators (issue #5). ADX and MFI use the classic
# textbook values; they have NOT been calibrated on 1m BTCUSDT data, and per the ATR% note
# above thresholds are not portable across timeframes - treat them as placeholders until a
# backtest sweep validates them.
# ADX < trend.min: no trend, breakout signals are unreliable (range regime).
# ADX > trend.strong: trending, mean-reversion signals are unreliable.
prediction.adx.trend.min=20
prediction.adx.trend.strong=25
prediction.mfi.oversold=20
prediction.mfi.neutral.low=40
prediction.mfi.neutral.high=60
prediction.mfi.overbought=80
# Bollinger Width is (upper-lower)/middle*100, i.e. 2*stddev*2.0/price*100 = 4x the close
# stddev as a percentage of price. Over a 300-candle (5h) 1m window BTCUSDT typically wanders
# ~0.3-0.5% of price, putting normal width around 1.2-2.0; 0.5 is roughly a third of that and
# is meant to fire only on a real squeeze. This number is DERIVED, NOT MEASURED - it is the
# least validated value in this file and must be swept against the real width distribution
# before being trusted to veto trades.
prediction.bollinger.squeeze.threshold=0.5

# Only the directional rules feed this average (RSI+SMA+MACD, and MFI since issue #5);
# ATR/Volatility/Regime act as a separate veto filter (see RuleBasedPredictor.addFilterRule).
# WARNING: adding MfiRule changed the denominator of that average, so the score distribution
# is no longer the one this threshold was calibrated against. Re-run the backtest sweep before
# trusting the 0.27-0.30 plateau below.
# 0.28 sits in the middle of
# a validated profitable plateau (0.27-0.30, ~1 trade/day, profit factor ~1.04) found via
# backtest on 90 days of real BTCUSDT 1m data with the rescaled indicator periods above.
# This edge is thin and was only validated on one historical window - re-validate
# periodically and treat with more caution than the original 15m setup.
prediction.buy.threshold=0.28
prediction.sell.threshold=-0.28
prediction.hold.min=-0.3
prediction.hold.max=0.3
prediction.confirmation.snapshots=2

trading.target.percent=2.0
trading.stop.loss.percent=1.5
trading.real.enabled=false
# Safety guard: required when trading.real.enabled=true AND binance.rest.url is not a testnet URL.
# Prevents accidentally going live with real funds due to a leftover/misconfigured endpoint.
trading.confirm.mainnet=false
trading.initial.capital.usdt=100
trading.max.drawdown.percent=5
trading.max.data.staleness.seconds=60
backtest.commission.rate=0.001
alert.discord.webhook.url=

# Binance testnet configuration
binance.ws.url=wss://stream.testnet.binance.vision:9443/ws/
binance.rest.url=https://testnet.binance.vision
binance.api.key=
binance.api.secret=
binance.max.retries=10
binance.initial.backoff.ms=1000
binance.max.backoff.ms=60000

db.url=jdbc:postgresql://localhost:5432/polymarket_btc
db.user=polymarket
db.password=senha@123
db.pool.size=10
db.pool.idle.timeout.ms=300000
db.pool.max.lifetime.ms=1800000
