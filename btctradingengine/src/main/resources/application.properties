market.symbol=BTCUSDT
market.interval.seconds=60
market.binance.interval=1m
# SMA(750) needs 750+ candles of warmup; keep some margin above the largest period below.
market.history.candles=1000

# Periods scaled x15 vs the original 15m config so each indicator still covers the same
# real-time window (e.g. RSI: 14*15m=3.5h -> 210*1m=3.5h), just recomputed every minute
# instead of every 15 minutes. Validated via backtest on 90 days of real BTCUSDT 1m data.
indicator.sma.period=750
indicator.ema.period=390
indicator.rsi.period=210
indicator.atr.period=210
indicator.macd.fast.period=180
indicator.macd.slow.period=390
indicator.macd.signal.period=135

# New indicators (issue #5), periods already scaled x15 for 1m candles like the block above:
# ADX 14*15m -> 210*1m, Bollinger/Donchian 20*15m -> 300*1m, MFI 14*15m -> 210*1m.
# These are the classic periods rescaled, NOT calibrated for this timeframe - run the
# /backtest endpoint (which accepts every one of them as a query param) before trusting them.
indicator.adx.period=210
indicator.bollinger.period=300
indicator.bollinger.stddev=2.0
indicator.mfi.period=210
indicator.donchian.period=300
# daily = reset the VWAP accumulator on every UTC day change (live default);
# rolling = sliding window of indicator.vwap.rolling.periods candles (what backtests want,
# since an arbitrary date range would otherwise start with a half-accumulated session).
indicator.vwap.anchor=daily
indicator.vwap.rolling.periods=300
# Price action (issue #6). lookback = N candles for the recent high/low distance and how long a
# swing level stays eligible as support/resistance (20*15m -> 300*1m). swing.strength = candles
# on each side a pivot must beat (2*15m -> 30*1m); swing fields lag by that many candles, since a
# pivot is only confirmed once its right side has printed. Rescaled, NOT calibrated.
indicator.priceaction.lookback=300
indicator.priceaction.swing.strength=30
# CVD (issue #11): rolling window of N candles for cvd, cvdRatio and largeCvd (20*15m -> 300*1m).
# Rolling instead of cumulative since startup, so the value does not depend on when the bot or
# the backtest range started. Rescaled, NOT calibrated.
indicator.cvd.period=300
# EMA slope (issue #7): % change of the EMA over this many candles (1*15m -> 15*1m). Only its sign
# is used, to confirm the trend direction +DI/-DI report. Rescaled, NOT calibrated.
indicator.ema.slope.periods=15
# VPIN (issue #13): volume-synchronized probability of informed trading, approximated with the taker
# buy/sell split (klines in backtests, aggTrades live). Candle volume is poured into buckets of
# bucket.candles times the average candle volume; VPIN is the mean |buy - sell| / bucket volume over
# the last N buckets, in [0, 1]. Defaults give ~20-minute buckets over ~16h, and
# market.history.candles=1000 (= 50 * 20) is enough warmup for it. NOT a true probability - it
# inherits every error of the buy/sell classification. Rescaled, NOT calibrated.
indicator.vpin.buckets=50
indicator.vpin.bucket.candles=20
# Absorption (issue #12): heavy aggression on one side that does not move price. A candle counts when
# |deltaRatio| >= delta.min, volume >= volume.ratio.min times the average, and price moved at most
# max.move.atr ATRs in the direction of the aggression. + = sell aggression absorbed (bullish),
# - = buy aggression absorbed (bearish); window sums the last N candles. Inferred from trades only -
# the absorbing passive orders need the order book (issue #10). Placeholders, NOT calibrated.
feature.absorption.delta.min=0.3
feature.absorption.volume.ratio.min=1.5
feature.absorption.max.move.atr=0.25
feature.absorption.window=15

feature.volatility.short.periods=75
feature.volatility.long.periods=300
feature.volume.average.periods=300
# Aggressor trades at or above this notional (price * quantity, in the quote currency - USDT) count
# as "large" for largeCvd / largeVolumeShare. Whale vs retail is a HEURISTIC: one aggTrade groups
# the fills of a taker order at a single price, so a market order that sweeps several levels shows
# up as several smaller aggTrades and is undercounted. Klines carry no trade sizes, so backtests only
# have the size split with /backtest?sizeSplit=true (see backtest.aggtrades.cache.dir). Ticks are
# persisted with their side so a different threshold can be re-applied to past data.
feature.flow.large.trade.notional=100000

prediction.rsi.oversold=30
prediction.rsi.neutral.low=40
prediction.rsi.neutral.high=60
prediction.rsi.overbought=70
prediction.sma.distance.extreme=3
prediction.sma.distance.moderate=1
# Calibrated for the rescaled 1m ATR(210) % distribution on BTCUSDT (p25 ~0.023%,
# p75 ~0.060%, p95 ~0.119% over a 90-day sample). Re-check these if indicator.atr.period
# or the candle interval changes again - they are NOT portable across timeframes (this
# project already got bitten once by reusing daily-candle ATR% thresholds at 15m).
prediction.atr.volatility.low=0.023
prediction.atr.volatility.normal=0.060
prediction.atr.volatility.high=0.119
prediction.macd.histogram.strong.atr.ratio=0.20
prediction.volatility.ratio.high=1.5

# Regime/flow thresholds for the new indicators (issue #5). ADX and MFI use the classic
# textbook values; they have NOT been calibrated on 1m BTCUSDT data, and per the ATR% note
# above thresholds are not portable across timeframes - treat them as placeholders until a
# backtest sweep validates them.
# ADX < trend.min: no trend, breakout signals are unreliable (range regime).
# ADX > trend.strong: trending, mean-reversion signals are unreliable.
prediction.adx.trend.min=20
prediction.adx.trend.strong=25
prediction.mfi.oversold=20
prediction.mfi.neutral.low=40
prediction.mfi.neutral.high=60
prediction.mfi.overbought=80
# Bollinger Width is (upper-lower)/middle*100, i.e. 2*stddev*2.0/price*100 = 4x the close
# stddev as a percentage of price. Over a 300-candle (5h) 1m window BTCUSDT typically wanders
# ~0.3-0.5% of price, putting normal width around 1.2-2.0; 0.5 is roughly a third of that and
# is meant to fire only on a real squeeze. This number is DERIVED, NOT MEASURED - it is the
# least validated value in this file and must be swept against the real width distribution
# before being trusted to veto trades.
prediction.bollinger.squeeze.threshold=0.5

# Market regime gating (issue #7). The regime is always classified and shown; when this is true it
# also removes the rule family that regime invalidates from the score:
#   TREND_UP / TREND_DOWN (ADX >= trend.strong, +DI/-DI and EMA slope agree) -> RSI, MFI and SMA
#     distance are off (mean reversion fights the trend)
#   RANGE (ADX < trend.min) -> MACD is off (trend following gets whipsawed), and AdxRegimeRule
#     stops vetoing low ADX, since that veto would block the mean-reversion entries kept here
#   SQUEEZE / TRANSITION / UNKNOWN -> nothing is gated; the squeeze veto still applies
# OFF by default: in a trend only MACD is left voting, and a weak MACD alone (0.3) already crosses
# the 0.28 buy threshold, so entries change a lot. Compare /backtest with regimeGatingEnabled=true
# and false before turning it on.
prediction.regime.gating.enabled=false

# VPIN entry guard (issue #13). When enabled, VPIN at or above prediction.vpin.high blocks NEW
# entries only. Target, stop and signal-reversal exits still go through - toxic flow is exactly when
# an exit matters most, which is why the signal is not turned into HOLD.
# OFF by default and 0.35 is a placeholder: look at the VPIN values on the dashboard and compare
# /backtest with vpinFilterEnabled=true and false before trusting it.
prediction.vpin.filter.enabled=false
prediction.vpin.high=0.35

# Order book entry guard (issue #10): an execution filter, not a score vote. When enabled, a new BUY
# is not opened while the book's bid share is below buy.min, nor a new SELL while it is above
# sell.max. Exits still go through, as with the VPIN guard, and missing data never blocks.
# OFF by default and the thresholds are placeholders - and unlike VPIN this one cannot be checked in
# /backtest, which has no order book. Look at the imbalance on the dashboard before enabling it.
prediction.orderbook.filter.enabled=false
prediction.orderbook.buy.min=0.35
prediction.orderbook.sell.max=0.65

# Only the directional rules feed this average (RSI+SMA+MACD, and MFI since issue #5);
# ATR/Volatility/Regime act as a separate veto filter (see RuleBasedPredictor.addFilterRule).
# WARNING: adding MfiRule changed the denominator of that average, so the score distribution
# is no longer the one this threshold was calibrated against. Re-run the backtest sweep before
# trusting the 0.27-0.30 plateau below.
# 0.28 sits in the middle of
# a validated profitable plateau (0.27-0.30, ~1 trade/day, profit factor ~1.04) found via
# backtest on 90 days of real BTCUSDT 1m data with the rescaled indicator periods above.
# This edge is thin and was only validated on one historical window - re-validate
# periodically and treat with more caution than the original 15m setup.
prediction.buy.threshold=0.28
prediction.sell.threshold=-0.28
prediction.hold.min=-0.3
prediction.hold.max=0.3
prediction.confirmation.snapshots=2

trading.target.percent=2.0
trading.stop.loss.percent=1.5
trading.real.enabled=false
# Whether a SELL signal may OPEN a short position (issue #67). The spot market has no short selling:
# with no position, a SELL would send a SELL MARKET order for BTC the bot never bought - rejected for
# insufficient balance, or, if the account happens to hold BTC, selling the user's own coins and
# buying them back later. Real mode therefore NEVER opens a short, whatever this says.
# It only applies to simulation and /backtest (where the flag is also a query parameter), and it is
# off so their results reflect what is actually executable. Turn it on only to study what a strategy
# that could go short would have done - those trades are not reproducible on spot.
# A SELL always still CLOSES an open BUY; this flag never blocks an exit.
trading.allow.short=false
# Safety guard: required when trading.real.enabled=true AND binance.rest.url is not a testnet URL.
# Prevents accidentally going live with real funds due to a leftover/misconfigured endpoint.
trading.confirm.mainnet=false
trading.initial.capital.usdt=100
trading.max.drawdown.percent=5
trading.max.data.staleness.seconds=60
# Real mode (issue #99): after a BUY fills, an OCO SELL rests on Binance with the target (LIMIT_MAKER)
# and the stop (STOP_LOSS_LIMIT), so the position stays protected if the bot, network or database
# go down. Off: target/stop are only checked on ticks while the bot runs. Placement failures fall
# back to the tick exits with an alert. BTC_ENGINE_TRADING_OCO_ENABLED in .env overrides this.
trading.oco.enabled=true
# The stop's limit price sits this % below its trigger. With limit == stop a fast drop can skip the
# limit and leave the order unfilled; the offset accepts a little slippage to get filled. If the price
# still falls below the limit without a fill, the bot cancels the OCO and exits at market.
trading.oco.stop.limit.offset.percent=0.1
backtest.commission.rate=0.001
# Blank disables the alerts; BTC_ENGINE_DISCORD_WEBHOOK_URL in .env overrides this.
alert.discord.webhook.url=

# Binance execution venue (testnet by default): orders, user data stream, reconciliation and the
# exchangeInfo symbol filters. NOT used for market data - see market.data.* below (issue #76).
binance.ws.url=wss://stream.testnet.binance.vision:9443/ws/
binance.rest.url=https://testnet.binance.vision
# Market data (issue #76): aggTrade ticks and warmup klines, so candles and every indicator built on them.
# Mainnet even when execution is on the testnet: the testnet price/volume is synthetic, which would make
# basisPercent compare a fake spot with the real perpetual and live VPIN/CVD unlike the (mainnet) backtest.
# Paper trading therefore runs on real prices. A testnet URL here logs a warning while derivatives or the
# order book are enabled.
market.data.ws.url=wss://stream.binance.com:9443/ws/
market.data.rest.url=https://api.binance.com
# Keep these blank and put the keys in .env (BTC_ENGINE_BINANCE_API_KEY / _SECRET) instead.
binance.api.key=
binance.api.secret=
binance.max.retries=10
binance.initial.backoff.ms=1000
binance.max.backoff.ms=60000

# Derivatives (issue #53): BTCUSDT USD-M perpetual, used as context for the spot market.
# Always mainnet - testnet futures data is synthetic, the same reason /backtest reads mainnet
# klines. Set enabled=false where fapi.binance.com is blocked: every deriv field stays empty and
# the bot keeps running.
# Live reads everything from the futures REST API. Backtests read funding and basis from the REST
# history, and open interest and long/short from the daily metrics dumps (see below, issue #54).
derivatives.enabled=true
binance.futures.rest.url=https://fapi.binance.com
# Funding (last SETTLED rate, the same definition the backtest uses - not the predicted one),
# open interest and long/short ratio. Each poll is also written to derivatives_snapshots.
derivatives.poll.seconds=60
# Perpetual price for the live basis. At a candle's close the live basis uses a price up to this
# old, while the backtest uses the final kline close - a small live/backtest difference.
derivatives.basis.poll.seconds=5
# A reading older than this at a candle's close is reported as missing instead of carried forward.
derivatives.stale.seconds=300
# openInterestChangePercent compares open interest now against this many minutes earlier.
derivatives.open.interest.change.minutes=60
# Backtest history for open interest and long/short (issue #54): the REST API keeps only 30 days, so
# /backtest reads the daily futures metrics dumps (5-minute rows, about 11 KB per day). A row's
# create_time is the start of its period: its values are only published 5 minutes later, which is the
# time they are used from. Backtest open interest is the 5-minute sumOpenInterest, live is the
# instantaneous value, so the two can differ slightly. Zips are cached in the directory below
# (blank = <java.io.tmpdir>/btc-trading-engine/metrics); a day not published yet is retried next run.
binance.data.url=https://data.binance.vision
derivatives.metrics.cache.dir=

# Trade size split in backtests (issue #51): /backtest?sizeSplit=true rebuilds each candle's flow
# from the daily spot aggTrades dumps, so largeCvd / largeVolumeShare exist in the backtest too.
# Opt-in because the first run downloads ~12 MB per day (90 days is about 1.1 GB); only the per-candle
# aggregate is cached (blank dir = <java.io.tmpdir>/btc-trading-engine/aggtrades). The aggregate keeps
# volume per notional bucket (<1k, 1k-10k, 10k-100k, 100k-1M, >=1M), so feature.flow.large.trade.notional
# can change without downloading again - but a threshold that is not one of those edges is rounded up
# to the next edge.
backtest.aggtrades.cache.dir=

# Order book imbalance (issue #10): the spot book is polled every orderbook.poll.seconds from
# orderbook.rest.url (mainnet on purpose - the testnet book is synthetic) and reduced to the bid share
# bidVolume / (bidVolume + askVolume) over the top orderbook.depth.levels levels. Levels must be a
# Binance limit (5, 10, 20, 50, 100, 500, 1000, 5000); up to 100 costs 5 request weight per call.
# A candle gets the MEAN of the snapshots taken while it was open, null when there were none: a single
# snapshot is too noisy (on 2026-09-13 the top 20 BTCUSDT levels spanned only ~0.005% of price).
# LIVE ONLY: there is no free order book history, so it is null in backtests. Every snapshot is
# written to order_book_snapshots to build that history.
orderbook.enabled=true
orderbook.rest.url=https://api.binance.com
orderbook.poll.seconds=5
orderbook.depth.levels=100

# Dashboard security (issues #66 and #98). The HTTP server binds to the loopback address only, so
# nothing on the network reaches the dashboard; for remote access put a reverse proxy with TLS in
# front instead of opening this up.
server.address=127.0.0.1
# Login required by every page, every /api/** endpoint and the /ws/live handshake (Spring Security).
# BLANK PASSWORD = no user exists and nobody can log in (fail closed): set one before using the
# dashboard. Spring Boot also reads these from the DASHBOARD_AUTH_USERNAME / DASHBOARD_AUTH_PASSWORD
# / DASHBOARD_AUTH_ROLES environment variables, which take precedence over this file.
# A password with no {id} prefix is plain text and is hashed at startup; prefer storing the encoded
# value, e.g. dashboard.auth.password={bcrypt}$2a$10$... , so the plain text is not on disk.
# Roles: TRADER may place manual orders, VIEWER may only watch.
dashboard.auth.username=trader
dashboard.auth.password=
dashboard.auth.roles=VIEWER,TRADER
# Origins allowed to open the /ws/live WebSocket, which streams position, signals and P&L. Add the
# host you actually open the dashboard from if it is not one of these.
dashboard.allowed.origins=http://localhost:8080,http://127.0.0.1:8080

# Database and user created by docker-compose.yml - keep the three in sync if you change them.
db.url=jdbc:postgresql://localhost:5432/btc_trading_engine
db.user=btc_engine
# Deliberately blank: the password comes from BTC_ENGINE_DB_PASSWORD in .env (see .env.example), the
# same variable compose uses to create the database, so a secret is never committed.
db.password=
db.pool.size=10
db.pool.idle.timeout.ms=300000
db.pool.max.lifetime.ms=1800000
