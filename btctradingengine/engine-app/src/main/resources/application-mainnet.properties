# Profile "mainnet" (SPRING_PROFILES_ACTIVE=mainnet): execution on Binance Spot mainnet - REAL MONEY.
# It only points the execution venue at mainnet. It does NOT turn real trading on and does NOT confirm it:
# trading.real.enabled=true still refuses to start until trading.confirm.mainnet=true is set explicitly
# (environment, command line or a local file), and the API keys still come from .env.
binance.ws.url=wss://stream.binance.com:9443/ws/
binance.rest.url=https://api.binance.com
