# Profile "testnet" (SPRING_PROFILES_ACTIVE=testnet): orders, user data stream and reconciliation go to
# the Binance Spot Testnet. Market data, derivatives, the order book and backtests stay on mainnet public
# data (issue #76). These are also the defaults of application.properties; the profile makes the choice
# explicit in a deploy.
binance.ws.url=wss://stream.testnet.binance.vision:9443/ws/
binance.rest.url=https://testnet.binance.vision
trading.confirm.mainnet=false
